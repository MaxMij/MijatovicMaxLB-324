<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Anmeldung – Tagebbbuch</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/semantic-ui@2.4.2/dist/semantic.min.css">
</head>
<body>
    <div class="ui container" style="margin-top: 40px; max-width: 420px;">
        <h1 class="ui header">Anmeldung</h1>
        <form class="ui form" method="POST" action="{{ url_for('login') }}">
            <div class="field">
                <label for="password">Passwort</label>
                <input id="password" type="password" name="password" required autocomplete="current-password" placeholder="Passwort">
            </div>
            <button class="ui blue button" type="submit">Anmelden</button>
        </form>
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="ui message" style="margin-top: 1em;">
            {% for message in messages %}
            <p>{{ message }}</p>
            {% endfor %}
        </div>
        {% endif %}
        {% endwith %}
    </div>
</body>
</html>
